spring.application.name=EmployeeManagement-System

spring.datasource.url=jdbc:mysql://localhost:3306/student
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Application logs
 #//it enables info level  logging for package
logging.level.in.mindcraft=INFO

# Save logs into a file
#//saves the applicatsion logs into a log file
logging.file.name=logs/student-management.log 

# JWT Configuration
jwt.secret=MyStudentManagementSystemSecretKeyForJWT2026VerySecure
jwt.expiration=3600000

# External API Configuration
external.api.base-url=https://jsonplaceholder.typicode.com

